<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>এলার্ম</title>
<style>
body{font-family:sans-serif;margin:0;padding:16px;background:#111;color:#fff}
h2{text-align:center}
.box{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;padding:12px;font-size:20px;border-radius:8px;border:0}
button{padding:12px;border:0;border-radius:8px;background:#22c55e;color:#fff;font-size:16px}
.item{display:flex;justify-content:space-between;align-items:center;background:#222;padding:12px;margin:8px 0;border-radius:10px}
.t{font-size:28px}
.d{background:#ef4444}
</style></head><body>
<h2>⏰ এলার্ম ঘড়ি</h2>
<div class="box"><input type="time" id="t"><button onclick="add()">যোগ</button></div>
<input id="l" placeholder="নাম (ঐচ্ছিক)" style="width:100%;box-sizing:border-box;margin-bottom:12px">
<div id="list"></div>
<script>
const LN=window.Capacitor&&Capacitor.Plugins.LocalNotifications;
const CH='alarm2';
let A=JSON.parse(localStorage.getItem('al')||'[]');
async function init(){
 if(!LN)return;
 await LN.requestPermissions();
 await LN.createChannel({id:CH,name:'Alarm',importance:5,vibration:true,visibility:1,sound:'alarm.wav'});
}
async function sched(a){
 if(!LN)return;
 await LN.schedule({notifications:[{id:a.id,title:'⏰ এলার্ম',body:a.l||'সময় হয়েছে',channelId:CH,sound:'alarm.wav',schedule:{on:{hour:a.h,minute:a.m},allowWhileIdle:true}}]});
}
async function cancel(id){if(LN)await LN.cancel({notifications:[{id}]});}
function save(){localStorage.setItem('al',JSON.stringify(A));show();}
async function add(){
 const v=document.getElementById('t').value;
 if(!v)return alert('সময় দিন');
 const [h,m]=v.split(':').map(Number);
 const a={id:Date.now()%2000000000,h,m,l:document.getElementById('l').value,on:true};
 A.push(a);await sched(a);save();
}
async function tog(id){
 const a=A.find(x=>x.id==id);a.on=!a.on;
 a.on?await sched(a):await cancel(id);save();
}
async function del(id){await cancel(id);A=A.filter(x=>x.id!=id);save();}
function p(n){return String(n).padStart(2,'0')}
function show(){
 document.getElementById('list').innerHTML=A.map(a=>`<div class="item"><div><div class="t">${p(a.h)}:${p(a.m)}</div><small>${a.l||''}</small></div><div><button onclick="tog(${a.id})">${a.on?'চালু':'বন্ধ'}</button> <button class="d" onclick="del(${a.id})">মুছুন</button></div></div>`).join('');
}
init();show();
</script></body></html>
