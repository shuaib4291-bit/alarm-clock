name: Build APK - OCR App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install PWABuilder CLI
      run: npm install -g @pwabuilder/cli
    
    - name: Create output folder
      run: mkdir -p output
    
    - name: Build APK with PWABuilder
      run: |
        pwabuilder https://shuaib4291-bit.github.io/ocr-app/ android --output ./output 2>&1 | tee output.log || true
        echo "=== Build completed ==="
        ls -la output/
      continue-on-error: true
    
    - name: Search for APK files
      run: |
        echo "=== Searching for APK/AAB ==="
        find . -name "*.apk" -o -name "*.aab" -o -name "*.zip" 2>/dev/null
        echo ""
        echo "=== Output folder ==="
        ls -la output/
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ocr-app-apk
        path: |
          output/**/*.apk
          output/**/*.aab
          output/**/*.zip
          **/*.apk
          **/*.aab
          output.log
        if-no-files-found: warn
        retention-days: 30