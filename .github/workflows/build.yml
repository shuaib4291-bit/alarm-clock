name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install PWABuilder CLI
      run: npm install -g @pwabuilder/cli
    
    - name: Create output folder
      run: mkdir -p output
    
    - name: Build APK with PWABuilder
      run: |
        pwabuilder https://shuaib4291-bit.github.io/ocr-app/ android \
          --output ./output \
          --package-id io.github.shuaib4291.ocrapp \
          --app-name "OCR" \
          --app-version 1.0.0 \
          --launcher-name "OCR" || echo "PWABuilder failed, trying alternative..."
      continue-on-error: true
    
    - name: List generated files
      run: |
        echo "=== Checking output folder ==="
        ls -la output/ || echo "Output folder empty"
        echo "=== Searching for APK/AAB files ==="
        find . -name "*.apk" -o -name "*.aab" -o -name "*.zip" | head -20
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ocr-app-apk
        path: |
          output/*.apk
          output/*.aab
          output/*.zip
          **/*.apk
          **/*.aab
        if-no-files-found: warn
        retention-days: 30