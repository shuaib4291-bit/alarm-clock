<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR - ছবি থেকে টেক্সট</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
    <h1>🔍 ছবি থেকে টেক্সট আলাদা করুন</h1>
    <p class="subtitle">OCR প্রযুক্তি দিয়ে বাংলা ও ইংরেজি টেক্সট বের করুন</p>

    <div class="lib-status" id="libStatus">⏳ OCR ইঞ্জিন লোড হচ্ছে...</div>

    <div class="controls">
        <label class="file-input-wrapper">
            <input type="file" id="imageInput" accept="image/*">
            <span class="btn btn-upload">📁 ছবি আপলোড</span>
        </label>

        <select class="language-select" id="languageSelect">
            <option value="ben+eng">বাংলা + ইংরেজি</option>
            <option value="ben">বাংলা</option>
            <option value="eng">ইংরেজি</option>
        </select>

        <button class="btn btn-extract" id="extractBtn" disabled>✨ টেক্সট আলাদা করুন</button>
        <button class="btn btn-copy" id="copyBtn" disabled>📋 কপি</button>
        <button class="btn btn-download" id="downloadBtn" disabled>⬇️ ডাউনলোড</button>
        <button class="btn btn-clear" id="clearBtn" disabled>🗑️ ক্লিয়ার</button>
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">প্রস্তুত হচ্ছে...</div>
    </div>

    <div class="status" id="status"></div>

    <div class="main-content">
        <div class="panel">
            <div class="panel-title">🖼️ ছবি প্রিভিউ</div>
            <div class="image-preview" id="imagePreview">
                <div class="placeholder" id="placeholder">
                    <p>এখানে ছবি দেখানো হবে</p>
                </div>
                <img id="previewImg" alt="Preview">
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">📝 প্রাপ্ত টেক্সট</div>
            <textarea class="text-output" id="textOutput" placeholder="ছবি থেকে পাওয়া টেক্সট এখানে দেখা যাবে..."></textarea>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
